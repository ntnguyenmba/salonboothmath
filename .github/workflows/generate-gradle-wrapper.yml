name: Generate Gradle Wrapper

on:
  push:
    paths:
      - ".github/workflows/generate-gradle-wrapper.yml"

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Commit wrapper to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper already complete."
          else
            git commit -m "Add complete Android Gradle wrapper"
            git push origin HEAD:main
          fi
