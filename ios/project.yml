name: SalonBoothMath
options:
  bundleIdPrefix: com.everittventures
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  SalonBoothMath:
    type: application
    platform: iOS
    sources:
      - SalonBoothMath
    preBuildScripts:
      - name: Build 1024 App Icon
        script: |
          set -e
          SOURCE="$SRCROOT/../brand/app-icon.png"
          OUTPUT="$SRCROOT/SalonBoothMath/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          mkdir -p "$(dirname "$OUTPUT")"
          /usr/bin/sips -z 1024 1024 "$SOURCE" --out "$OUTPUT" >/dev/null
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everittventures.salonboothmath
        INFOPLIST_FILE: SalonBoothMath/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalonBoothMath/SalonBoothMath.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SalonBoothMathWidgetExtension
    scheme:
      testTargets:
        - SalonBoothMathTests

  SalonBoothMathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SalonBoothMathTests
    dependencies:
      - target: SalonBoothMath

  SalonBoothMathWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - SalonBoothMathWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everittventures.salonboothmath.widget
        INFOPLIST_FILE: SalonBoothMathWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalonBoothMathWidget/SalonBoothMathWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
