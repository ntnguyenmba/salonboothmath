name: SalonBoothMath
options:
  bundleIdPrefix: com.everittventures
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
targets:
  SalonBoothMath:
    type: application
    platform: iOS
    sources:
      - SalonBoothMath
    preBuildScripts:
      - name: Prepare App Icon
        script: |
          set -e
          ICON_DIR="$SRCROOT/SalonBoothMath/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cp "$SRCROOT/../204DCB60-8DB2-480E-B020-6686D78673D4.png" "$ICON_DIR/AppIcon.png"
          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images" : [
              { "filename" : "AppIcon.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everittventures.salonboothmath
        INFOPLIST_FILE: SalonBoothMath/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalonBoothMath/SalonBoothMath.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SalonBoothMathWidgetExtension
    scheme:
      testTargets:
        - SalonBoothMathTests

  SalonBoothMathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SalonBoothMathTests
    dependencies:
      - target: SalonBoothMath

  SalonBoothMathWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - SalonBoothMathWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everittventures.salonboothmath.widget
        INFOPLIST_FILE: SalonBoothMathWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalonBoothMathWidget/SalonBoothMathWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
