name: SalonBoothMath
options:
  bundleIdPrefix: com.everittventures
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.7.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
targets:
  SalonBoothMath:
    type: application
    platform: iOS
    sources:
      - SalonBoothMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everittventures.salonboothmath
        INFOPLIST_FILE: SalonBoothMath/Info.plist
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_ENTITLEMENTS: SalonBoothMath/SalonBoothMath.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SalonBoothMathWidgetExtension
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
    scheme:
      testTargets:
        - SalonBoothMathTests

  SalonBoothMathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SalonBoothMathTests
    dependencies:
      - target: SalonBoothMath

  SalonBoothMathWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - SalonBoothMathWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everittventures.salonboothmath.widget
        INFOPLIST_FILE: SalonBoothMathWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SalonBoothMathWidget/SalonBoothMathWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
